<div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Telefone</th>
      </tr>
    </thead>
    <tbody>
      @for (item of listaFiltrada; track $index) {
      <tr>
        <th>{{item.id}}</th>
        <td><a [routerLink]="['/clientes', item.id]">{{item.nome}}</a></td>
        <td>{{item.cpf}}</td>
        <td>{{item.telefone}}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
