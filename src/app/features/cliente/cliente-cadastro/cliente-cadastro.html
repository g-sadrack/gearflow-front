<div class="max-w-lx mx-auto mt-50 p-6 bg-base-200 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">Cadastrar Cliente</h2>
  <form class="flex" [formGroup]="clienteForm" (ngSubmit)="cadastrarCliente()">
    <div class="mr-4">
      <div class="mb-4">
        <label class="block mb-1">Nome Completo</label>
        <input type="text" formControlName="nome" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Email</label>
        <input type="email" formControlName="email" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Celular</label>
        <input type="text" formControlName="telefone" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">CPF</label>
        <input type="text" formControlName="cpf" class="input input-bordered w-full" />
      </div>
    </div>
    <div class="ml-4">
      <div class="mb-4">
        <label class="block mb-1">Cep</label>
        <input type="text" formControlName="cep" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Numero</label>
        <input type="text" formControlName="numero" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Bairro</label>
        <input type="email" formControlName="bairro" class="input input-bordered w-full" />
      </div>
    </div>
    <div class="ml-4">
      <div class="mb-4">
        <label class="block mb-1">Cidade</label>
        <input type="text" formControlName="cidade" name="cidade" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Complemento</label>
        <input type="text" formControlName="complemento" name="complemento" class="input input-bordered w-full" />
      </div>
      <div class="mb-4">
        <label class="block mb-1">Estado</label>
        <input type="text" formControlName="estado" class="input input-bordered w-full" />
      </div>
      <button type="submit" class="btn btn-primary w-full mt-4">Cadastrar</button>
    </div>
  </form>
</div>
